<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>최애 쓰다듬기</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f4efe9; font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif; }
  #bg { position:fixed; inset:0; background:#f4efe9 center/cover no-repeat; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:default; }
  #gl.hand { cursor:none; }
  #gl.move { cursor:grab; }
  #menu { position:fixed; top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right));
          display:flex; flex-direction:column; gap:10px; z-index:5; }
  .item { width:48px; height:48px; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
          background:rgba(255,255,255,.85); backdrop-filter:blur(6px); border:2px solid #222; border-radius:14px;
          font-size:24px; line-height:1; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .item.on { background:#ffe27a; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none; align-items:center; justify-content:center; gap:16px; }
  #overlay.show { display:flex; }
  #overlay button { font:inherit; font-size:18px; padding:16px 28px; border:2px solid #222; border-radius:16px; background:#fff; color:#222; cursor:pointer; }
  #overlay button:active { background:#ffe27a; }
  #hand { position:fixed; left:0; top:0; font-size:44px; pointer-events:none; z-index:4; transform:translate(-50%,-50%); display:none; will-change:transform; }
  #hint { position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%);
          background:rgba(0,0,0,.6); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; z-index:5; transition:opacity .4s; pointer-events:none; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl" class="hand"></canvas>
<div id="hand">🖐️</div>
<div id="hint">캐릭터를 문질러 쓰다듬어 보세요 🐱</div>

<div id="menu">
  <div class="item" id="btnPhoto" role="button" aria-label="사진 변경">📷</div>
  <div class="item" id="btnMove" role="button" aria-label="크기/위치 변경">✥</div>
  <div class="item on" id="btnHand" role="button" aria-label="손 아이콘">🖐️</div>
</div>
<div id="overlay"><button id="pickBg">배경</button><button id="pickChar">캐릭터</button></div>
<input type="file" id="fileBg" accept="image/*">
<input type="file" id="fileChar" accept="image/*">

<script>
/* ===== 설정 (Unity ShaderPettingController 기본값과 동일) ===== */
const CFG = {
  touchRadius: 1.2, maxStrength: -0.05, returnSpeed: 5,
  pulseStrength: 0.06, bounceFrequency: 25, bounceDecay: 10,
  audioVolume: 1,
  // 쓰다듬을 때 랜덤 재생할 소리 (audio 폴더에 파일을 넣고 경로를 적어주세요)
  audioFiles: [] // 예: ['audio/meow1.mp3', 'audio/purr.mp3']
};
const SPRITE_UNITS = 3; // 캐릭터 높이 = 3 월드 유닛 (touchRadius의 기준)

/* ===== 기본 캐릭터 (SVG 낙서 고양이) ===== */
const defaultCat = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<g fill="#fff" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path d="M130 300 Q90 380 120 450 Q200 480 270 465 Q330 470 400 450 Q430 380 385 300 Z"/>
<path d="M205 400 L205 455 M250 410 L250 462 M300 400 L300 455" fill="none"/>
<path d="M110 150 L120 80 L190 120 Z"/><path d="M400 150 L395 80 L325 120 Z"/>
<ellipse cx="256" cy="215" rx="150" ry="125"/></g>
<g fill="none" stroke="#222" stroke-width="7" stroke-linecap="round">
<path d="M165 205 Q195 190 220 205"/><path d="M292 205 Q317 190 347 205"/>
<path d="M235 250 Q245 262 256 250 Q267 262 277 250"/></g></svg>`);

/* ===== WebGL (JellyPettingShader.shader 포팅) ===== */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true });
const vs = `attribute vec2 a_pos; uniform vec2 u_res, u_center, u_size; varying vec2 v_uv; varying vec2 v_px;
void main(){ vec2 px = u_center + a_pos*u_size*0.5; v_px = px; v_uv = a_pos*0.5+0.5; v_uv.y = 1.0 - v_uv.y;
  gl_Position = vec4(px.x/u_res.x*2.0-1.0, 1.0-px.y/u_res.y*2.0, 0.0, 1.0); }`;
const fs = `precision mediump float; varying vec2 v_uv; varying vec2 v_px;
uniform sampler2D u_tex; uniform vec2 u_mouse, u_center; uniform float u_unit, u_radius, u_strength, u_pulse;
void main(){
  // 화면 픽셀 → 월드 유닛 (y 위쪽이 +)
  vec2 w = (v_px - u_center)/u_unit; w.y = -w.y;
  vec2 m = (u_mouse - u_center)/u_unit; m.y = -m.y;
  vec2 delta = w - m; float dist = length(delta);
  vec2 dir = delta / max(dist, 0.0001);
  float n = clamp(dist / max(u_radius, 0.0001), 0.0, 1.0);
  float shape = sin(n * 3.14159265);
  vec2 off = dir * shape * (u_strength + u_pulse);
  off.y = -off.y; // UV는 y가 아래쪽이 +
  vec4 c = texture2D(u_tex, v_uv + off);
  c.rgb *= c.a; gl_FragColor = c; }`;
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a_pos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {}; ['u_res','u_center','u_size','u_tex','u_mouse','u_unit','u_radius','u_strength','u_pulse'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

const tex = gl.createTexture(); let imgW = 1, imgH = 1;
function setCharacter(src){
  const img = new Image();
  img.onload = () => {
    imgW = img.width; imgH = img.height;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    // NPOT 대응
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  };
  img.src = src;
}
setCharacter(defaultCat);

/* ===== 상태 ===== */
const S = { x: 0.5, y: 0.5, scale: 1 };       // 위치(화면 비율), 크기 배율
const mouse = { x: -9999, y: -9999, down: false };
let mode = 'pet', handOn = true;
let strength = 0, pulse = 0, bounceTime = 0, pulseDir = 0, petting = false;
let dpr = 1;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

function spriteRect(){ // CSS px 기준
  const h = Math.min(innerWidth, innerHeight) * 0.6 * S.scale;
  const w = h * imgW / imgH;
  return { cx: S.x * innerWidth, cy: S.y * innerHeight, w, h };
}
function hitTest(px, py){
  const r = spriteRect();
  return Math.abs(px - r.cx) < r.w/2 && Math.abs(py - r.cy) < r.h/2;
}

/* ===== 오디오 ===== */
const clips = CFG.audioFiles.map(f => { const a = new Audio(f); a.loop = true; a.volume = CFG.audioVolume; return a; });
let curAudio = null, lastIdx = -1;
function playRandom(){
  if (!clips.length) return;
  let i = 0;
  if (clips.length > 1) do { i = Math.floor(Math.random()*clips.length); } while (i === lastIdx);
  lastIdx = i; curAudio = clips[i]; curAudio.currentTime = 0; curAudio.play().catch(()=>{});
}
function stopAudio(){ if (curAudio){ curAudio.pause(); curAudio = null; } }

/* ===== 입력 (마우스/터치 공통) ===== */
const pointers = new Map(); let dragOff = null, pinchStart = null;
function trigger(dir){ bounceTime = 0; pulseDir = dir; }
function stopPetting(){ if (petting){ petting = false; stopAudio(); } }

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true;
  document.getElementById('hint').style.opacity = 0;
  if (mode === 'move'){
    if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x-b.x, a.y-b.y), s: S.scale }; }
    else dragOff = { x: S.x - e.clientX/innerWidth, y: S.y - e.clientY/innerHeight };
  } else if (hitTest(e.clientX, e.clientY)) trigger(1.0);
});
canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'move' && pointers.size === 2 && pinchStart){
    const [a, b] = [...pointers.values()];
    S.scale = Math.min(4, Math.max(0.2, pinchStart.s * Math.hypot(a.x-b.x, a.y-b.y) / pinchStart.d));
  } else if (mode === 'move' && pointers.size === 1 && dragOff && mouse.down){
    S.x = e.clientX/innerWidth + dragOff.x; S.y = e.clientY/innerHeight + dragOff.y;
  }
});
function up(e){
  pointers.delete(e.pointerId); pinchStart = null; dragOff = null;
  if (pointers.size === 0){
    mouse.down = false;
    if (e.pointerType !== 'mouse'){ mouse.x = mouse.y = -9999; } // 터치는 손을 떼면 위치 해제
    if (mode === 'pet' && petting) trigger(-0.8);
  }
}
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => {
  if (mode !== 'move') return; e.preventDefault();
  S.scale = Math.min(4, Math.max(0.2, S.scale * (e.deltaY < 0 ? 1.08 : 0.93)));
}, { passive: false });

/* ===== 메뉴 ===== */
const btnMove = document.getElementById('btnMove'), btnHand = document.getElementById('btnHand');
btnMove.onclick = () => { mode = mode === 'pet' ? 'move' : 'pet'; btnMove.classList.toggle('on', mode === 'move'); canvas.classList.toggle('move', mode === 'move'); stopPetting();
  const h = document.getElementById('hint'); h.textContent = mode === 'move' ? '드래그: 이동 / 휠·핀치: 크기 조절' : '캐릭터를 문질러 쓰다듬어 보세요 🐱'; h.style.opacity = 1; setTimeout(()=>h.style.opacity = 0, 2500); };
btnHand.onclick = () => { handOn = !handOn; btnHand.classList.toggle('on', handOn); canvas.classList.toggle('hand', handOn); };

// 사진 변경 오버레이
const fileBg = document.getElementById('fileBg'), fileChar = document.getElementById('fileChar');
const overlay = document.getElementById('overlay');
document.getElementById('btnPhoto').onclick = () => overlay.classList.add('show');
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });
document.getElementById('pickBg').onclick = () => fileBg.click();
document.getElementById('pickChar').onclick = () => fileChar.click();
// blob: URL 대신 data: URL 사용 (보안 제한이 있는 환경에서도 동작), 큰 사진은 축소
function readImage(file, maxSize, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(file.type === 'image/png' || file.type === 'image/webp' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => alert('이미지를 불러오지 못했어요.');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
fileBg.onchange = () => { const f = fileBg.files[0]; if (f) readImage(f, 2560, url => { document.getElementById('bg').style.backgroundImage = `url("${url}")`; });
  fileBg.value = ''; overlay.classList.remove('show'); };
fileChar.onchange = () => { const f = fileChar.files[0]; if (f) readImage(f, 2048, url => setCharacter(url));
  fileChar.value = ''; overlay.classList.remove('show'); };

/* ===== 메인 루프 (ShaderPettingController.Update 포팅) ===== */
const handEl = document.getElementById('hand');
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;

  if (mode === 'pet' && mouse.down){
    if (hitTest(mouse.x, mouse.y)){
      if (!petting){ petting = true; playRandom(); }
      strength += (CFG.maxStrength - strength) * Math.min(1, dt * 15);
    } else stopPetting();
  } else stopPetting();
  if (!petting) strength += (0 - strength) * Math.min(1, dt * CFG.returnSpeed);

  if (pulseDir !== 0){
    bounceTime += dt;
    pulse = pulseDir * CFG.pulseStrength * Math.sin(bounceTime * CFG.bounceFrequency) * Math.exp(-bounceTime * CFG.bounceDecay);
    if (bounceTime > 1 || Math.abs(pulse) < 0.0005){ pulse = 0; pulseDir = 0; }
  }

  // 그리기
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const r = spriteRect();
  gl.uniform2f(U.u_res, innerWidth, innerHeight);
  gl.uniform2f(U.u_center, r.cx, r.cy);
  gl.uniform2f(U.u_size, r.w, r.h);
  gl.uniform2f(U.u_mouse, mouse.x, mouse.y);
  gl.uniform1f(U.u_unit, r.h / SPRITE_UNITS);
  gl.uniform1f(U.u_radius, CFG.touchRadius);
  gl.uniform1f(U.u_strength, strength);
  gl.uniform1f(U.u_pulse, pulse);
  gl.uniform1i(U.u_tex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // 손 아이콘
  const show = handOn && mode === 'pet' && mouse.x > -999;
  handEl.style.display = show ? 'block' : 'none';
  if (show){ handEl.style.transform = `translate(${mouse.x}px,${mouse.y}px) translate(-50%,-50%) scale(${mouse.down ? 0.88 : 1})`; }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
